name: Generate Aran narration for Berlin car-theft reel
on:
  push:
    branches: ["samples/aran-autodiebstahl-20261124-v2"]
    paths: [".github/workflows/aran-autodiebstahl-v2.yml"]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate six Aran voiceover clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = ["سرقت خودرو در برلین بیست درصد کمتر شده. پس چطور هنوز نرخ سرقتش ده برابر میانگین آلمانه؟ جواب توی دو عددیه که باید کنار هم ببینیم.","اول کل آلمان. گزارش تازهٔ صنعت بیمه می‌گه پارسال حدود دوازده هزار خودروی دارای بیمهٔ کاسکو دزدیده شد. تقریباً چهارده درصد کمتر از سال قبل.","حالا برلین. در کل آلمان تقریباً یک خودرو از هر سه هزار و سیصد خودرو دزدیده شد. در برلین، تقریباً یک خودرو از هر سیصد و سی و سه خودرو.","فرق این دو عدد چیه؟ بیست درصد کمتر، یعنی برلین نسبت به سال قبل خودش بهتر شده. ده برابر، یعنی نرخ ثبت‌شدهٔ برلین هنوز بالاتر از میانگین آلمانه.","یک عدد دیگه هم هست. خسارت ثبت‌شده برای هر سرقت به‌طور میانگین حدود بیست و یک هزار یورو بود.","این اعداد مربوط به خودروهای دارای بیمهٔ کاسکو در سال دو هزار و بیست و پنجه. منبع، گزارش تازهٔ انجمن صنعت بیمهٔ آلمانه."]
          out = pathlib.Path("narration")
          out.mkdir()
          for i, text in enumerate(lines, start=1):
              payload = {"text": text, "model_id": "eleven_v4", "language_code": "fa", "apply_text_normalization": "off", "voice_settings": {"speed": 1.0, "style": 0}}
              req = urllib.request.Request("https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128", json.dumps(payload, ensure_ascii=False).encode(), {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      if not data or not response.headers.get("Content-Type", "").startswith("audio/"):
                          raise SystemExit(f"Scene {i}: ElevenLabs response was not audio.")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Scene {i}: ElevenLabs HTTP {error.code}.") from None
              (out / f"scene-{i}.mp3").write_bytes(data)
          PY
      - name: Upload narration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: berlin-aran-narration-v2
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 2
