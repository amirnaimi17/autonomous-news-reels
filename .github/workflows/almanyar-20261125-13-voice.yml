name: Generate Aran narration for Black Friday consumer Reel
on:
  push:
    branches: ["runs/almanyar-20261125-13-voice"]
    paths: [".github/workflows/almanyar-20261125-13-voice.yml"]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate four Aran voiceover clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = ["روی یک کالا نوشته چهل درصد تخفیف. اما صبر کن، این چهل درصد نسبت به کدوم قیمته؟ قبل از خرید بلک فرایدی، دنبال یه عدد دیگه بگرد.","طبق مقررات آلمان، وقتی فروشنده برای یک کالا کاهش قیمت اعلام می‌کنه، معمولاً باید پایین‌ترین قیمتی رو هم نشون بده که خودش در سی روز قبل از تخفیف برای همون کالا گرفته.","مثلاً فرض کن قیمت پیشنهادی سازنده صد یوروست؛ ولی همین فروشنده هفتهٔ قبل کالا رو شصت و پنج یورو می‌فروخت و الان قیمتش شده شصت یورو. نسبت به هفتهٔ قبل، فقط پنج یورو کمتره.","بلک فرایدی امسال جمعه، بیست و هفتم نوامبره. قبل از پرداخت، مدل دقیق کالا رو در یک سایت مقایسهٔ قیمت جست‌وجو کن و قیمت نهایی با هزینهٔ ارسال رو کنار پیشنهادهای دیگه بذار."]
          out = pathlib.Path("narration")
          out.mkdir()
          for i, text in enumerate(lines, start=1):
              payload = {"text": text, "model_id": "eleven_v4", "language_code": "fa", "apply_text_normalization": "off", "voice_settings": {"speed": 1.0, "style": 0}}
              req = urllib.request.Request("https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128", json.dumps(payload, ensure_ascii=False).encode(), {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      if not data or not response.headers.get("Content-Type", "").startswith("audio/"):
                          raise SystemExit(f"Scene {i}: ElevenLabs response was not audio.")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Scene {i}: ElevenLabs HTTP {error.code}.") from None
              (out / f"scene-{i}.mp3").write_bytes(data)
          PY
      - name: Upload narration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: almanyar-black-friday-aran
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 2
