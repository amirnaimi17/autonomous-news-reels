name: Generate Aran narration for Orange Day public-service Reel
on:
  push:
    branches: ["runs/almanyar-20261125-11-voice"]
    paths: [".github/workflows/almanyar-20261125-11-voice.yml"]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate four Aran voiceover clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = ["اگه در آلمان به‌خاطر خشونت یا تهدید دنبال کمک باشی و آلمانی‌ات خوب نباشه، یه شماره هست که می‌تونی ازش مشاورهٔ تلفنی به فارسی بگیری.","امروز، بیست و پنج نوامبر، روز جهانی مبارزه با خشونت علیه زنانه. امسال هم خط ملی حمایت از زنان در آلمان به همین مناسبت، کمپین روز نارنجی رو برگزار می‌کنه.","شماره رو این‌طوری به خاطر بسپار: یک، یک، شش، صفر، یک، شش. تماس از داخل آلمان رایگانه، شبانه‌روزیه و می‌تونی بدون گفتن اسمت مشاوره بگیری.","برای مترجم بگو فارسی یا دَری. اگر نگران یکی از نزدیکانت هم هستی، خودت می‌تونی تماس بگیری و بپرسی چطور می‌شه کمک کرد. آدرس سایت رسمی رو در کپشن گذاشتم."]
          out = pathlib.Path("narration")
          out.mkdir()
          for i, text in enumerate(lines, start=1):
              payload = {"text": text, "model_id": "eleven_v4", "language_code": "fa", "apply_text_normalization": "off", "voice_settings": {"speed": 1.0, "style": 0}}
              req = urllib.request.Request("https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128", json.dumps(payload, ensure_ascii=False).encode(), {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      if not data or not response.headers.get("Content-Type", "").startswith("audio/"):
                          raise SystemExit(f"Scene {i}: ElevenLabs response was not audio.")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Scene {i}: ElevenLabs HTTP {error.code}.") from None
              (out / f"scene-{i}.mp3").write_bytes(data)
          PY
      - name: Upload narration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: almanyar-orange-aran
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 2
