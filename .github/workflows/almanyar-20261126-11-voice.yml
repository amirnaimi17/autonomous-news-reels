name: Generate Aran narration for Candle consumer Reel
on:
  push:
    branches: ["runs/almanyar-20261126-11-voice"]
    paths: [".github/workflows/almanyar-20261126-11-voice.yml"]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate four Aran voiceover clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = ["قبل از اینکه برای خونه شمع بخری، پشت بسته‌ش رو نگاه کن. آیا اصلاً مشخصه این شمع از چه ماده‌ای ساخته شده؟ گزارش تازهٔ امروز از آلمان جواب جالبی داره.","انجمن محیط زیست آلمان، دی یو اچ، پنجصد و هفده شمع رو در چهل و شش شعبه از دوازده فروشگاه زنجیره‌ای بررسی کرده. روی سیصد و هشتاد و نه تا، هیچ اطلاعاتی دربارهٔ مواد اولیه نبوده.","در نمونه‌های بررسی‌شده، فقط هفتاد شمع اطلاعات کامل داشتن. دربارهٔ سیصد و هفتاد و نه شمع هم مشخص نبود اصلاً روغن پالم دارن یا نه.","جالب اینجاست که در دی ام، شصت و شش تا از شصت و هفت شمع بررسی‌شده اطلاعات مواد اولیه نداشتن. فروشگاه‌های ارگانیک دنس و آلاناتورا شفاف‌ترین بودن. اگه ترکیب شمع برات مهمه، قبل از خرید دنبال توضیح مشخص روی بسته‌بندی بگرد."]
          out = pathlib.Path("narration")
          out.mkdir()
          for i, text in enumerate(lines, start=1):
              payload = {"text": text, "model_id": "eleven_v4", "language_code": "fa", "apply_text_normalization": "off", "voice_settings": {"speed": 1.0, "style": 0}}
              req = urllib.request.Request("https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128", json.dumps(payload, ensure_ascii=False).encode(), {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      if not data or not response.headers.get("Content-Type", "").startswith("audio/"):
                          raise SystemExit(f"Scene {i}: ElevenLabs response was not audio.")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Scene {i}: ElevenLabs HTTP {error.code}.") from None
              (out / f"scene-{i}.mp3").write_bytes(data)
          PY
      - name: Upload narration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: almanyar-candles-aran
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 2
