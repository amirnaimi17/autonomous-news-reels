name: Generate Aran narration for Berlin car-theft reel
on:
  push:
    branches: ["samples/aran-autodiebstahl-20261124"]
    paths: [".github/workflows/aran-autodiebstahl-preview.yml"]
permissions:
  contents: read
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate six Aran voiceover clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = ["بیست‌وچهارم نوامبر، صنعت بیمهٔ آلمان آمار تازهٔ سرقت خودرو را منتشر کرد. در سال گذشته سرقت خودروهای دارای بیمهٔ کاسکو تقریباً چهارده درصد کمتر شد.","در سراسر آلمان، دوازده هزار و دویست و یازده خودروی دارای بیمهٔ کاسکو دزدیده شد. یعنی در این آمار، تقریباً یک خودرو از هر سه هزار و سیصد و سی و سه خودرو.","در برلین تصویر فرق می‌کند. در آمار بیمه‌ها، تقریباً یک خودرو از هر سیصد و سی و سه خودرو دزدیده شده. این نرخ حدود ده برابر میانگین کل آلمان است.","البته تعداد سرقت‌ها در خود برلین هم نسبت به سال قبل بیست درصد کمتر شده. با وجود این کاهش، برلین همچنان بالاترین نرخ سرقت خودرو را بین ایالت‌های آلمان دارد.","جمع خسارت بیمه‌شده به دویست و پنجاه و چهار میلیون یورو رسید. میانگین خسارت ثبت‌شده برای هر سرقت، بیست هزار و هفتصد و هفتاد و پنج یورو بود.","این مقایسه بر پایهٔ آمار خودروهای دارای بیمهٔ کاسکوست. منبع، گزارش انجمن صنعت بیمهٔ آلمان است."]
          out = pathlib.Path("narration")
          out.mkdir()
          for i, text in enumerate(lines, start=1):
              payload = {"text": text, "model_id": "eleven_v4", "language_code": "fa", "apply_text_normalization": "off", "voice_settings": {"speed": 1.0, "style": 0}}
              req = urllib.request.Request("https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128", json.dumps(payload, ensure_ascii=False).encode(), {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      data = response.read()
                      if not data or not response.headers.get("Content-Type", "").startswith("audio/"):
                          raise SystemExit(f"Scene {i}: ElevenLabs response was not audio.")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Scene {i}: ElevenLabs HTTP {error.code}.") from None
              (out / f"scene-{i}.mp3").write_bytes(data)
          PY
      - name: Upload narration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: berlin-aran-narration
          path: narration/*.mp3
          if-no-files-found: error
          retention-days: 2
