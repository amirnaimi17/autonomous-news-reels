name: Build Almanyar AI product liability reel
on:
  push:
    branches: ["runs/almanyar-20261128-12-ai-liability"]
    paths: [".github/workflows/almanyar-20261128-12-ai-liability.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: runs/almanyar-20261128-12-ai-liability
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python3 -m pip install --user pillow arabic-reshaper python-bidi
          curl --fail --location --retry 3 --output Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf
      - name: Generate Aran narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.request
          key = os.environ.get("ELEVENLABS_API_KEY")
          if not key:
              raise SystemExit("ELEVENLABS_API_KEY is unavailable to this run.")
          lines = [
              "فکر می‌کنی اگر یک اپ یا ابزار هوش مصنوعی بهت خسارت بزند، قانون هنوز آن را فقط یک فایل می‌بیند؟ از نهم دسامبر، جواب در آلمان عوض می‌شود.",
              "قانون مسئولیت محصول مدرن می‌شود. نرم‌افزار، اپ و سامانه‌های هوش مصنوعی هم می‌توانند محصول حساب شوند. یعنی سازندهٔ محصول دیجیتال معیوب، ممکن است مسئول خسارت باشد.",
              "این فقط دربارهٔ شرکت سازنده نیست. اگر تولیدکننده بیرون اتحادیهٔ اروپا باشد، بسته به شرایط، واردکننده، نماینده یا ارائه‌دهندهٔ خدمات تکمیل سفارش هم ممکن است طرف مطالبه قرار بگیرد.",
              "نکتهٔ مهم: این قانون به معنی جبران خودکار هر ضرر نیست. باید عیب، خسارت و ارتباطشان ثابت شود. اما از نهم دسامبر، مسیر قانونی برای محصولات دیجیتال روشن‌تر و حمایت مصرف‌کننده قوی‌تر می‌شود."
          ]
          out = pathlib.Path("narration"); out.mkdir(exist_ok=True)
          for i, text in enumerate(lines, 1):
              payload = {
                  "text": text,
                  "model_id": "eleven_v4",
                  "language_code": "fa",
                  "apply_text_normalization": "off",
                  "voice_settings": {"speed": 1.0, "style": 0}
              }
              for attempt in range(1, 5):
                  req = urllib.request.Request(
                      "https://api.elevenlabs.io/v1/text-to-speech/PEdcOLzbXYhL8IKOswXB?output_format=mp3_44100_128",
                      json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                      {"xi-api-key": key, "Content-Type": "application/json", "Accept": "audio/mpeg"}
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as response:
                          data = response.read()
                          ctype = response.headers.get("Content-Type", "")
                          if not data or not ctype.startswith("audio/"):
                              raise RuntimeError("response was not audio")
                      (out / f"scene-{i}.mp3").write_bytes(data)
                      print(f"scene {i}: narration ready ({len(data)} bytes)")
                      break
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, RuntimeError) as exc:
                      code = getattr(exc, "code", None)
                      if code and 400 <= code < 500 and code != 429:
                          raise SystemExit(f"scene {i}: permanent ElevenLabs HTTP {code}") from None
                      if attempt == 4:
                          raise SystemExit(f"scene {i}: narration failed after 4 attempts: {type(exc).__name__}") from None
                      time.sleep(5)
          PY
      - name: Create four distinct Persian visual scenes
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from bidi.algorithm import get_display
          import arabic_reshaper, math, pathlib
          W,H=1080,1920
          font_path="Vazirmatn-Bold.ttf"
          font_big=ImageFont.truetype(font_path, 78)
          font_med=ImageFont.truetype(font_path, 52)
          font_small=ImageFont.truetype(font_path, 34)
          def rtl(s): return get_display(arabic_reshaper.reshape(s))
          def text_r(draw, lines, y, font, fill=(255,255,255), gap=20, margin=80):
              for line in lines:
                  shaped=rtl(line)
                  box=draw.textbbox((0,0), shaped, font=font)
                  draw.text((W-margin-(box[2]-box[0]), y), shaped, font=font, fill=fill)
                  y += (box[3]-box[1])+gap
              return y
          def base(c1,c2):
              im=Image.new("RGB",(W,H),c1); p=im.load()
              for y in range(H):
                  t=y/(H-1)
                  col=tuple(int(c1[k]*(1-t)+c2[k]*t) for k in range(3))
                  for x in range(W): p[x,y]=col
              return im
          out=pathlib.Path("scenes"); out.mkdir(exist_ok=True)
          # 1: phone, AI chip, warning
          im=base((11,28,61),(25,83,106)); d=ImageDraw.Draw(im)
          d.rounded_rectangle((170,150,910,1050),70,fill=(18,24,40),outline=(103,232,249),width=8)
          d.rounded_rectangle((225,225,855,930),35,fill=(225,247,250))
          d.rounded_rectangle((390,390,690,690),40,fill=(31,41,55),outline=(14,165,233),width=10)
          d.text((474,475),"AI",font=ImageFont.truetype(font_path,105),fill=(255,255,255))
          d.line((255,250,530,590,350,810,760,500,830,900),fill=(239,68,68),width=18)
          d.ellipse((755,110,955,310),fill=(239,68,68)); d.text((818,122),"!",font=ImageFont.truetype(font_path,120),fill="white")
          d.rounded_rectangle((55,1130,1025,1810),55,fill=(4,15,30,220),outline=(255,255,255),width=3)
          text_r(d,["اگر یک اپ بهت خسارت بزند…","چه کسی مسئول است؟"],1210,font_big)
          text_r(d,["قانون آلمان از ۹ دسامبر تغییر می‌کند"],1510,font_med,fill=(165,243,252))
          im.save(out/"scene-1.png")
          # 2: scales, code and digital product
          im=base((45,18,80),(88,28,135)); d=ImageDraw.Draw(im)
          d.line((540,170,540,850),fill=(250,204,21),width=28)
          d.line((260,330,820,330),fill=(250,204,21),width=24)
          for cx in (300,780):
              d.line((cx,330,cx-120,650),fill=(250,204,21),width=12)
              d.line((cx,330,cx+120,650),fill=(250,204,21),width=12)
              d.arc((cx-160,570,cx+160,820),0,180,fill=(250,204,21),width=22)
          d.rounded_rectangle((350,500,730,850),40,fill=(15,23,42),outline=(216,180,254),width=8)
          d.text((418,580),"</>",font=ImageFont.truetype(font_path,105),fill=(216,180,254))
          d.rounded_rectangle((55,1020,1025,1810),55,fill=(20,10,35),outline=(255,255,255),width=3)
          text_r(d,["نرم‌افزار و هوش مصنوعی","هم «محصول» حساب می‌شوند"],1100,font_big)
          text_r(d,["سازندهٔ محصول دیجیتال معیوب","ممکن است مسئول خسارت باشد"],1430,font_med,fill=(233,213,255))
          im.save(out/"scene-2.png")
          # 3: EU supply chain and accountability
          im=base((6,78,59),(11,124,105)); d=ImageDraw.Draw(im)
          d.ellipse((80,170,500,590),fill=(15,118,110),outline=(153,246,228),width=8)
          for a in range(0,360,30):
              x=290+155*math.cos(math.radians(a)); y=380+155*math.sin(math.radians(a))
              d.ellipse((x-9,y-9,x+9,y+9),fill=(250,204,21))
          d.rounded_rectangle((620,220,980,560),45,fill=(240,253,250),outline=(45,212,191),width=7)
          d.text((700,305),"EU",font=ImageFont.truetype(font_path,100),fill=(15,118,110))
          for x1,y1,x2,y2 in [(500,380,620,380),(250,680,540,850),(830,680,540,850)]:
              d.line((x1,y1,x2,y2),fill=(153,246,228),width=18)
          for cx,label in [(250,"واردکننده"),(830,"نماینده"),(540,"خدمات سفارش")]:
              d.ellipse((cx-110,760,cx+110,980),fill=(15,23,42),outline=(153,246,228),width=7)
              shaped=rtl(label); box=d.textbbox((0,0),shaped,font=font_small)
              d.text((cx-(box[2]-box[0])/2,840),shaped,font=font_small,fill="white")
          d.rounded_rectangle((55,1090,1025,1810),55,fill=(3,45,38),outline=(255,255,255),width=3)
          text_r(d,["فقط شرکت سازنده نیست"],1170,font_big)
          text_r(d,["در بعضی شرایط، واردکننده یا نماینده","هم می‌تواند طرف مطالبه باشد"],1410,font_med,fill=(204,251,241))
          im.save(out/"scene-3.png")
          # 4: calendar + practical caveat
          im=base((87,28,28),(153,27,27)); d=ImageDraw.Draw(im)
          d.rounded_rectangle((180,130,900,900),65,fill=(255,247,237),outline=(254,202,202),width=8)
          d.rectangle((180,130,900,340),fill=(185,28,28))
          d.text((375,165),"DEC",font=ImageFont.truetype(font_path,95),fill="white")
          d.text((405,385),"9",font=ImageFont.truetype(font_path,300),fill=(127,29,29))
          for y in (1020,1170,1320):
              d.ellipse((110,y,180,y+70),fill=(34,197,94))
              d.line((128,y+35,145,y+53,173,y+17),fill="white",width=10)
          text_r(d,["عیب و خسارت باید ثابت شود","ارتباط آن‌ها هم باید روشن باشد","اما حمایت مصرف‌کننده قوی‌تر می‌شود"],1015,font_med,margin=100,gap=45)
          d.rounded_rectangle((80,1570,1000,1795),40,fill=(69,10,10),outline=(254,202,202),width=3)
          text_r(d,["اجرای قانون: ۹ دسامبر ۲۰۲۶"],1630,font_big,margin=115)
          im.save(out/"scene-4.png")
          PY
      - name: Render and validate MP4
        run: |
          set -euo pipefail
          mkdir -p segments deliveries
          for i in 1 2 3 4; do
            audio_duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "narration/scene-$i.mp3")
            duration=$(python3 -c "print(round(float('$audio_duration')+0.55,3))")
            ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 30 -i "scenes/scene-$i.png" -i "narration/scene-$i.mp3"               -filter_complex "[0:v]scale=1200:2134,zoompan=z='min(zoom+0.00065,1.07)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,format=yuv420p[v]"               -map "[v]" -map 1:a -t "$duration" -c:v libx264 -preset medium -crf 19 -c:a aac -b:a 192k -movflags +faststart "segments/scene-$i.mp4"
          done
          printf "file 'scene-1.mp4'\nfile 'scene-2.mp4'\nfile 'scene-3.mp4'\nfile 'scene-4.mp4'\n" > segments/list.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i segments/list.txt -c copy deliveries/almanyar-20261128-12-ai-liability.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 deliveries/almanyar-20261128-12-ai-liability.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 deliveries/almanyar-20261128-12-ai-liability.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 deliveries/almanyar-20261128-12-ai-liability.mp4)" = "audio"
          ffprobe -v error -show_entries format=duration,size -of json deliveries/almanyar-20261128-12-ai-liability.mp4
          sha256sum deliveries/almanyar-20261128-12-ai-liability.mp4
      - name: Commit verified delivery
        run: |
          git config user.name "Almanyar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add deliveries/almanyar-20261128-12-ai-liability.mp4
          git commit -m "Add verified AI product liability reel for 28 November noon"
          git push origin HEAD:runs/almanyar-20261128-12-ai-liability
      - name: Upload verified video artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: almanyar-20261128-12-ai-liability
          path: deliveries/almanyar-20261128-12-ai-liability.mp4
          if-no-files-found: error
          retention-days: 3
